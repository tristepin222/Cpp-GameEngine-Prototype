name: Build Engine

on:
  push:
    branches:
      - dummy

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Headers, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          if (-not $env:VULKAN_SDK) {
            Write-Error "VULKAN_SDK environment variable is not set."
            exit 1
          }

          $header = Join-Path $env:VULKAN_SDK "Include\vulkan\vulkan.h"
          $library = Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib"
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"

          Write-Host "Header:  $header"
          Write-Host "Library: $library"
          Write-Host "GLSLC:   $glslc"

          if (-not (Test-Path $header)) {
            Write-Error "Vulkan headers not found at $header"
            exit 1
          }

          if (-not (Test-Path $library)) {
            Write-Error "Vulkan library not found at $library"
            exit 1
          }

          if (-not (Test-Path $glslc)) {
            Write-Error "glslc not found at $glslc"
            exit 1
          }

          Write-Host "Vulkan SDK verification successful."

          & $glslc --version

      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path "build/ci") {
            Remove-Item -Recurse -Force "build/ci"
          }

          cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content "build/ci/CMakeCache.txt" |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object {
              ($_ -split "=")[1].Trim()
            }

          if (-not $version) {
            Write-Error "Could not determine project version from CMake."
            exit 1
          }

          Write-Host "Project version: $version"

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          $package = "EngineWorkspace-v${{ env.VERSION }}.zip"

          if (-not (Test-Path "sdk")) {
            Write-Error "sdk directory does not exist."
            exit 1
          }

          Compress-Archive `
            -Path "sdk\*" `
            -DestinationPath $package

          Write-Host "Created package: $package"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
