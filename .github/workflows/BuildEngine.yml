name: Build Engine

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          if (-not $env:VULKAN_SDK) {
            Write-Error "VULKAN_SDK is not set"
            exit 1
          }

          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"

          if (-not (Test-Path $glslc)) {
            Write-Error "glslc.exe not found at $glslc"
            Get-ChildItem "$env:VULKAN_SDK\Bin" | Select-Object Name
            exit 1
          }

          Write-Host "Found glslc: $glslc"
          & $glslc --version

      - name: Configure
        run: cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content build/ci/CMakeCache.txt |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object { ($_ -split "=")[1].Trim() }

          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path sdk\* `
            -DestinationPath "EngineWorkspace-v${{ env.VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
