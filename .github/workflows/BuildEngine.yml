name: Build Engine

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          if (-not $env:VULKAN_SDK) {
            Write-Error "VULKAN_SDK environment variable is not set."
            exit 1
          }

          Write-Host ""
          Write-Host "Vulkan SDK contents:"
          Get-ChildItem -Path $env:VULKAN_SDK -Recurse -File |
            Select-Object -First 100 FullName

          Write-Host ""
          Write-Host "Searching for vulkan.h..."
          Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter "vulkan.h" |
            Select-Object FullName

          Write-Host ""
          Write-Host "Searching for vulkan-1.lib..."
          Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter "vulkan-1.lib" |
            Select-Object FullName

          Write-Host ""
          Write-Host "Searching for glslc.exe..."
          Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter "glslc.exe" |
            Select-Object FullName

      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path "build/ci") {
            Remove-Item -Recurse -Force "build/ci"
          }

          cmake --preset windows-ci `
            -DVulkan_INCLUDE_DIR="$env:VULKAN_SDK\Include" `
            -DVulkan_LIBRARY="$env:VULKAN_SDK\Lib\vulkan-1.lib"

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content "build/ci/CMakeCache.txt" |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object { ($_ -split "=")[1].Trim() }

          if (-not $version) {
            Write-Error "Could not determine project version."
            exit 1
          }

          Write-Host "Project version: $version"

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          $package = "EngineWorkspace-v${{ env.VERSION }}.zip"

          Compress-Archive `
            -Path "sdk\*" `
            -DestinationPath $package

          Write-Host "Created package: $package"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
