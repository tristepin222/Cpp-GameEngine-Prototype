name: Build Engine

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.341.1"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"

          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan-sdk.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          $sdkPath = "C:\VulkanSDK\$version"

          if (-not (Test-Path $sdkPath)) {
            Write-Error "Vulkan SDK was not installed at $sdkPath"
            exit 1
          }

          "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          if (!(Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h")) {
            Write-Error "vulkan.h not found"
            exit 1
          }

          if (!(Test-Path "$env:VULKAN_SDK\Lib\vulkan-1.lib")) {
            Write-Error "vulkan-1.lib not found"
            exit 1
          }

          if (!(Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) {
            Write-Error "glslc.exe not found"
            exit 1
          }

          Write-Host "Vulkan SDK is valid."

          & "$env:VULKAN_SDK\Bin\glslc.exe" --version

      - name: Configure
        run: cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content "build/ci/CMakeCache.txt" |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object { ($_ -split "=")[1].Trim() }

          if (-not $version) {
            Write-Error "Could not determine project version."
            exit 1
          }

          Write-Host "Project version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          $package = "EngineWorkspace-v${{ env.VERSION }}.zip"

          Compress-Archive `
            -Path "sdk\*" `
            -DestinationPath $package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
