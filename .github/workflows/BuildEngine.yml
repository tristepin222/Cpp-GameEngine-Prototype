name: Build Engine

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = cmake -S . -B build/ci -LA -N |
            Select-String "CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object { ($_ -split "=")[1].Trim() }

          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path sdk\* `
            -DestinationPath "EngineWorkspace-v${{ env.VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"