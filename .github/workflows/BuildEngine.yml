name: Build Engine

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          version: 1.4.341.1
          cache: true
          vulkan-components: Vulkan-Headers;Vulkan-Loader;Glslang

      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          if (-not $env:VULKAN_SDK) {
            Write-Error "VULKAN_SDK environment variable is not set."
            exit 1
          }

          Write-Host ""
          Write-Host "Vulkan SDK contents:"
          Get-ChildItem -Path $env:VULKAN_SDK -Recurse -File |
            Select-Object -First 100 FullName

          Write-Host ""
          Write-Host "Searching for Vulkan headers..."
          $header = Get-ChildItem `
            -Path $env:VULKAN_SDK `
            -Recurse `
            -Filter "vulkan.h" |
            Select-Object -First 1

          if (-not $header) {
            Write-Error "vulkan.h was not found in the Vulkan SDK."
            exit 1
          }

          Write-Host "Found: $($header.FullName)"

          Write-Host ""
          Write-Host "Searching for Vulkan library..."
          $library = Get-ChildItem `
            -Path $env:VULKAN_SDK `
            -Recurse `
            -Filter "vulkan-1.lib" |
            Select-Object -First 1

          if (-not $library) {
            Write-Error "vulkan-1.lib was not found in the Vulkan SDK."
            exit 1
          }

          Write-Host "Found: $($library.FullName)"

          Write-Host ""
          Write-Host "Searching for glslc..."
          $glslc = Get-ChildItem `
            -Path $env:VULKAN_SDK `
            -Recurse `
            -Filter "glslc.exe" |
            Select-Object -First 1

          if (-not $glslc) {
            Write-Error "glslc.exe was not found in the Vulkan SDK."
            exit 1
          }

          Write-Host "Found: $($glslc.FullName)"

          Write-Host ""
          Write-Host "Vulkan SDK verification successful."

          & $glslc.FullName --version

      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path "build/ci") {
            Remove-Item -Recurse -Force "build/ci"
          }

          cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content "build/ci/CMakeCache.txt" |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object {
              ($_ -split "=")[1].Trim()
            }

          if (-not $version) {
            Write-Error "Could not determine project version from CMake."
            exit 1
          }

          Write-Host "Project version: $version"

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          $package = "EngineWorkspace-v${{ env.VERSION }}.zip"

          if (-not (Test-Path "sdk")) {
            Write-Error "sdk directory does not exist."
            exit 1
          }

          Compress-Archive `
            -Path "sdk\*" `
            -DestinationPath $package

          Write-Host "Created package: $package"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
