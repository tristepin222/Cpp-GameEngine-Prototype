name: Build Engine

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: jakoch/vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          if ($env:VULKAN_SDK) {
            Get-ChildItem "$env:VULKAN_SDK\Include\vulkan\vulkan.h"
          }

      - name: Configure
        run: cmake --preset windows-ci

      - name: Get version
        shell: pwsh
        run: |
          $version = Get-Content build/ci/CMakeCache.txt |
            Select-String "^CMAKE_PROJECT_VERSION:STATIC=" |
            ForEach-Object { ($_ -split "=")[1].Trim() }

          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path sdk\* `
            -DestinationPath "EngineWorkspace-v${{ env.VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "EngineWorkspace-v${{ env.VERSION }}"
          path: "EngineWorkspace-v${{ env.VERSION }}.zip"
